<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="TAZ — illustrative brand composition">
  <!-- Illustrative cover for the TAZ project card (brand composition, not a product screenshot) -->
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#0b0b0c" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b0b0c" stop-opacity="0.9"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="#0b0b0c"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <!-- Vault dial -->
  <g transform="translate(1180 500)" fill="none">
    <circle r="300" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
    <circle r="236" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
    <circle r="172" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
    <circle r="96" fill="#121314" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
    <g stroke="#ffffff" stroke-opacity="0.16" stroke-width="2">
      <path d="M0 -236V-212"/><path d="M0 236V212"/><path d="M-236 0H-212"/><path d="M236 0H212"/>
      <path d="M167 -167L150 -150"/><path d="M-167 167L-150 150"/><path d="M-167 -167L-150 -150"/><path d="M167 167L150 150"/>
    </g>
    <!-- lime accent arc -->
    <path d="M0 -236A236 236 0 0 1 204 -118" stroke="#C6FF5E" stroke-width="4" stroke-linecap="round"/>
    <circle cx="204" cy="-118" r="8" fill="#C6FF5E"/>
    <rect x="-6" y="-60" width="12" height="44" rx="6" fill="#C6FF5E"/>
  </g>

  <!-- TAZ wordmark drawn as geometry so it renders identically without web fonts -->
  <g transform="translate(150 300)" fill="#f5f5f5">
    <!-- T -->
    <rect x="0" y="0" width="244" height="64"/>
    <rect x="90" y="0" width="64" height="320"/>
    <!-- A -->
    <path fill-rule="evenodd" d="M272 320L372 0H452L552 320H482L461 252H363L342 320ZM382 192H442L412 92Z"/>
    <!-- Z -->
    <path d="M580 0H830V60L668 260H830V320H580V260L742 60H580Z"/>
  </g>
  <rect x="150" y="676" width="96" height="6" fill="#C6FF5E"/>

  <rect width="1600" height="1000" fill="url(#vignette)"/>
</svg>
